id = "rst"
name = "reST"
description = "reST syntax support."
version = "0.0.3"
schema_version = 1
authors = ["elmarco", "stsewd"]
repository = "https://github.com/elmarco/zed-rst"

[grammars.rst]
repository = "https://github.com/stsewd/tree-sitter-rst.git"
commit = "a60f1070b824cb8bb8409b4b6d7da0d07997c30e"

[language_servers.esbonio]
name = "Esbonio"
language = "reST"
language_ids = { "reST" = "rst" }

# esbonio --version (version detection)
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--version"]

# pipx install/reinstall/upgrade esbonio
[[capabilities]]
kind = "process:exec"
command = "pipx"
args = ["install", "esbonio"]

[[capabilities]]
kind = "process:exec"
command = "pipx"
args = ["reinstall", "esbonio"]

[[capabilities]]
kind = "process:exec"
command = "pipx"
args = ["upgrade", "esbonio"]

[[capabilities]]
kind = "process:exec"
command = "pipx"
args = ["environment", "--value", "PIPX_BIN_DIR"]

# uv tool install/upgrade esbonio
[[capabilities]]
kind = "process:exec"
command = "uv"
args = ["tool", "install", "esbonio"]

[[capabilities]]
kind = "process:exec"
command = "uv"
args = ["tool", "install", "--force", "esbonio"]

[[capabilities]]
kind = "process:exec"
command = "uv"
args = ["tool", "upgrade", "esbonio"]

[[capabilities]]
kind = "process:exec"
command = "uv"
args = ["tool", "dir", "--bin"]
